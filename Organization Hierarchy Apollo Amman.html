
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apollo Tyres Amman - Organizational Hierarchy</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    min-height: 100%;
    font-family: "Segoe UI", Arial, sans-serif;
    color: #142b42;
    background: #f8fafc;
}

.hierarchy-wrapper {
    width: 100%;
    overflow-x: auto;
    background: #f8fafc;
}

.hierarchy {
    position: relative;
    width: 1000px;
    height: 790px;
    margin: 0 auto;
    overflow: hidden;
    background-color: #f8fafc;
    background-image:
        linear-gradient(#e5ebf2 1px, transparent 1px),
        linear-gradient(90deg, #e5ebf2 1px, transparent 1px);
    background-size: 28px 28px;
}

/* Connector lines */
.connectors {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    pointer-events: none;
}

/* Hierarchy cards */
.node {
    position: absolute;
    width: 234px;
    height: 132px;
    padding: 15px 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    background: #ffffff;
    border: 1px solid #3973ff;
    border-radius: 12px;
    z-index: 2;
}

.node.muted {
    opacity: 0.40;
    border-color: #cbd5e1;
    background: rgba(255, 255, 255, 0.85);
}

.account {
    position: absolute;
    top: 0;
    left: 355px;
    width: 294px;
    height: 72px;
    padding: 12px 16px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    background: #142338;
    color: #ffffff;
    border-radius: 0 0 13px 13px;
    z-index: 3;
}

.account-name {
    font-size: 19px;
    font-weight: 700;
    line-height: 1.35;
}

.account-subtitle {
    margin-top: 7px;
    font-size: 12px;
    color: #cbd5e1;
}

.avatar {
    width: 46px;
    height: 46px;
    flex: 0 0 46px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 8px;
    border-radius: 50%;
    color: #164075;
    background: #e6edf8;
    font-size: 14px;
    font-weight: 700;
}

.node-name {
    margin: 0;
    color: #142338;
    font-size: 14px;
    font-weight: 700;
    line-height: 1.4;
}

.node-role {
    display: inline-block;
    margin-top: 7px;
    padding: 5px 11px;
    border-radius: 20px;
    color: #174d9c;
    background: #e8eef9;
    font-family: Consolas, monospace;
    font-size: 10px;
    letter-spacing: 0.7px;
    white-space: nowrap;
}

.node-role.teal {
    color: #007f7e;
    background: #e0f3ef;
}

/* Main vertical hierarchy */
.unit-head {
    top: 106px;
    left: 383px;
}

.senior-rm {
    top: 272px;
    left: 383px;
}

.primary-rm {
    top: 438px;
    left: 383px;
}

/* Parallel coverage roles */
.backup-rm {
    top: 438px;
    left: 110px;
}

.assistant-rm {
    top: 438px;
    left: 659px;
}

/* Specialist RMs */
.trade-rm {
    top: 638px;
    left: 0;
    width: 235px;
    height: 132px;
}

.cash-rm {
    top: 638px;
    left: 252px;
    width: 241px;
    height: 132px;
}

.treasury-rm {
    top: 638px;
    left: 510px;
    width: 242px;
    height: 132px;
}

.network-rm {
    top: 638px;
    left: 769px;
    width: 231px;
    height: 132px;
}

/* Preserve the visually highlighted cards */
.treasury-rm {
    border-color: #3973ff;
    opacity: 1;
}

@media (max-width: 1000px) {
    .hierarchy {
        margin-left: 0;
        margin-right: 0;
    }
}

@media print {
    body, .hierarchy-wrapper {
        background: #f8fafc;
        print-color-adjust: exact;
        -webkit-print-color-adjust: exact;
    }

    .hierarchy {
        margin: 0;
    }
}
</style>
</head>

<body>
<div class="hierarchy-wrapper">
<div class="hierarchy">

    <!-- Connector lines -->
    <svg class="connectors" viewBox="0 0 1000 790"
         xmlns="http://www.w3.org/2000/svg">

        <!-- Main reporting line -->
        <g fill="none" stroke="#ccd6e4" stroke-width="2">
            <path d="M502 72 V106"/>
            <path d="M502 238 V272"/>
            <path d="M502 404 V438"/>
        </g>

        <!-- Primary RM to parallel coverage roles -->
        <g fill="none" stroke="#cbd5e1" stroke-width="1.5"
           stroke-dasharray="3 3">
            <path d="M383 504 H344"/>
            <path d="M617 504 H659"/>
        </g>

        <!-- Primary RM to specialist RMs -->
        <g fill="none" stroke="#cbd5e1" stroke-width="2">
            <path d="M502 570 V605"/>
            <path d="M117 605 H885"/>
            <path d="M117 605 V638"/>
            <path d="M372 605 V638"/>
            <path d="M631 605 V638"/>
            <path d="M885 605 V638"/>
        </g>
    </svg>

    <!-- Corporate account -->
    <div class="account">
        <div class="account-name">Apollo Tyres – Amman</div>
        <div class="account-subtitle">Corporate client</div>
    </div>

    <!-- Unit Head -->
    <div class="node unit-head">
        <div class="avatar">N</div>
        <p class="node-name">Naseer</p>
        <span class="node-role">UNIT HEAD</span>
    </div>

    <!-- Senior RM -->
    <div class="node senior-rm">
        <div class="avatar">A</div>
        <p class="node-name">Adam</p>
        <span class="node-role">SENIOR RM (SRM)</span>
    </div>

    <!-- Backup RM -->
    <div class="node muted backup-rm">
        <div class="avatar">Z</div>
        <p class="node-name">Zahir</p>
        <span class="node-role">BACKUP RM</span>
    </div>

    <!-- Primary RM -->
    <div class="node primary-rm">
        <div class="avatar">A</div>
        <p class="node-name">Ahmad</p>
        <span class="node-role">PRIMARY RM</span>
    </div>

    <!-- Assistant RM -->
    <div class="node muted assistant-rm">
        <div class="avatar">AQ</div>
        <p class="node-name">Mr. Aziz Al Qahtani</p>
        <span class="node-role">ASSISTANT RM (ARM)</span>
    </div>

    <!-- Trade RM -->
    <div class="node muted trade-rm">
        <div class="avatar">SH</div>
        <p class="node-name">Mr. Saeed Al Hammadi</p>
        <span class="node-role teal">TRADE RM</span>
    </div>

    <!-- Cash RM -->
    <div class="node muted cash-rm">
        <div class="avatar">FI</div>
        <p class="node-name">Ms. Farah Ibrahim</p>
        <span class="node-role teal">CASH RM</span>
    </div>

    <!-- Treasury RM -->
    <div class="node treasury-rm">
        <div class="avatar" style="background:#dff2ed;color:#007f7e;">AW</div>
        <p class="node-name">Mr. Abdul Wan</p>
        <span class="node-role teal">TREASURY RM</span>
    </div>

    <!-- Network RM -->
    <div class="node muted network-rm">
        <div class="avatar">A</div>
        <p class="node-name">Abboud</p>
        <span class="node-role teal">NETWORK RM</span>
    </div>

</div>
</div>
</body>
</html>
